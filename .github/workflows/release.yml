name: Build & Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 每次推送自动把版本号 +1（用 run number），versionCode 同步递增，保证覆盖安装。
      - name: Resolve version
        id: ver
        shell: bash
        run: |
          APP_VERSION=$(grep -E '^appVersion=' gradle.properties | cut -d= -f2 | tr -d '\r')
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${APP_VERSION}.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "build=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: >
          gradle assembleRelease --no-daemon --stacktrace
          -PbuildNumber=${{ steps.ver.outputs.build }}
          -PversionName=${{ steps.ver.outputs.version }}

      # GitHub 会剥掉 Release 资产名里的非 ASCII 字符，所以上传用 ASCII 文件名，
      # 中文名通过资产 label 显示在 Release 页面上。
      - name: Rename APK
        shell: bash
        run: |
          mkdir -p out
          APK="out/GitHub-v${{ steps.ver.outputs.version }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          ls -lh out

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: GitHub加速 v${{ steps.ver.outputs.version }}
          body: |
            ## GitHub加速 v${{ steps.ver.outputs.version }}

            GitHub 文件下载加速的安卓客户端（原生 Compose，移动端界面）。

            - 下载资产：`GitHub-v${{ steps.ver.outputs.version }}.apk`（Release 页面显示为 **GitHub加速-v${{ steps.ver.outputs.version }}**）
            - 系统要求：Android 7.0+（minSdk 24）
            - 应用内「设置 → 检查更新」可自动检测新版本；更新包会在 gh-proxy.org 与当前节点之间选快的下载
            - 版本号由 CI 自动递增，无需手动改

            > GitHub Releases 会剥离资产文件名中的中文，所以实际文件名是 `GitHub-v${{ steps.ver.outputs.version }}.apk`，中文名通过资产 label 显示。
          files: out/GitHub-v${{ steps.ver.outputs.version }}.apk
          make_latest: true
          overwrite_files: true

      - name: Set Chinese display label
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          TAG="v${VERSION}"
          NAME="GitHub-v${VERSION}.apk"
          REPO="${GITHUB_REPOSITORY}"
          ASSET_ID=$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${REPO}/releases/tags/${TAG}" \
            | jq -r --arg n "${NAME}" '.assets[] | select(.name==$n) | .id' | head -1)
          if [[ -z "${ASSET_ID}" ]]; then
            echo "asset not found"; exit 1
          fi
          jq -n --arg l "GitHub加速-v${VERSION}" '{label:$l}' > /tmp/label.json
          curl -sS -X PATCH -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            --data @/tmp/label.json \
            "https://api.github.com/repos/${REPO}/releases/assets/${ASSET_ID}" \
            -o /tmp/label-result.json -w "label update: %{http_code}\n"
          jq -r '"asset: \(.name) | label: \(.label)"' /tmp/label-result.json